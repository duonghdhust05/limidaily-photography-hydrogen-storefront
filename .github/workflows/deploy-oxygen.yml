name: Deploy to Shopify Oxygen

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: oxygen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Oxygen Edge Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS 22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Storefront Bundle
        run: npm run build

      # Deploy using Shopify Hydrogen Official Action
      # Biến SHOPIFY_HYDROGEN_STOREFRONT_TOKEN lấy từ Shopify Admin -> Hydrogen -> Storefront -> Deployment Token
      - name: Deploy to Shopify Oxygen
        uses: Shopify/hydrogen-action@v1
        with:
          oxygen-deployment-token: ${{ secrets.SHOPIFY_HYDROGEN_STOREFRONT_TOKEN }}
